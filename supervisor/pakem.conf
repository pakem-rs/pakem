[program:pakem]
command=/app/pakem-server
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/pakem.err.log
stdout_logfile=/var/log/pakem.out.log
environment=APP_ENV="production"

[program:pakem-worker]
command=/app/canting queue:work
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/pakem-worker.err.log
stdout_logfile=/var/log/pakem-worker.out.log
environment=APP_ENV="production"
